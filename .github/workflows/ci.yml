name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: v2.x
      - run: deno check src/avaliacao.ts cli/avaliar.ts
      - run: deno test
      - name: reproduz a nota de 15/10/2026
        run: |
          deno run --allow-read cli/avaliar.ts data/perguntas.json examples/respostas-2026-10-15.json > /tmp/out.json
          deno eval 'const m = JSON.parse(await Deno.readTextFile("/tmp/out.json")); if (m.aprovados !== 18 || m.avaliados !== 19 || m.violacoes !== 0) { console.error(m.aprovados, m.avaliados, m.violacoes); Deno.exit(1); }'
